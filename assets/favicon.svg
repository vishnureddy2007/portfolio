<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#090d16" stroke="rgba(59, 130, 246, 0.4)" stroke-width="2"/>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#0d1527"/>
  <text x="32" y="42" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="url(#grad)" text-anchor="middle" letter-spacing="-1">VR</text>
  <circle cx="49" cy="42" r="3.5" fill="#06b6d4" filter="url(#glow)"/>
</svg>
